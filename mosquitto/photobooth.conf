# Mosquitto config for the Smart Photo Booth (Node 1, RPi 400)
# Install: sudo cp mosquitto/photobooth.conf /etc/mosquitto/conf.d/
#          sudo systemctl restart mosquitto

# Mosquitto 2.x only listens on localhost unless a listener is declared.
listener 1883 0.0.0.0

# Demo LAN only: no password. Switch to a password file before using any
# shared/public network (see docs/SETUP_NODE1_RU.md, step 2.5).
allow_anonymous true

# Keep retained status messages across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/
